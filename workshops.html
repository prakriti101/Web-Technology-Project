<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Workshops - Evoria</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo" style="font-family: Orbitron">Evoria</div>
      <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <section class="events">
      <h2>Workshop Events</h2>

      <div class="event-container">
        <div class="event-card">
          <img
            src="https://images.unsplash.com/photo-1518611012118-696072aa579a"
          />
          <div class="event-info">
            <h3>Dance Workshop</h3>
            <p>Workshop • 2026-04-10</p>
            <button onclick="register('Dance Workshop')">Register</button>
          </div>
        </div>

        <div class="event-card">
          <img
            src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2"
          />
          <div class="event-info">
            <h3>Photography Workshop</h3>
            <p>Workshop • 2026-05-12</p>
            <button onclick="register('Photography Workshop')">Register</button>
          </div>
        </div>
      </div>
    </section>

    <script>
      function register(eventName) {
        window.location.href =
          "register.html?event=" + encodeURIComponent(eventName);
      }
    </script>
  </body>
</html>
