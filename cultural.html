<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cultural Events - Evoria</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo" style="font-family: Orbitron">Evoria</div>
      <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <section class="events">
      <h2>Cultural Events</h2>

      <div class="event-container">
        <!-- Cultural Fest -->
        <div class="event-card">
          <img
            src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30"
          />
          <div class="event-info">
            <h3>Cultural Fest</h3>
            <p>Cultural • 2026-04-10</p>
            <button onclick="openRegister('Cultural Fest')">Register</button>
          </div>
        </div>

        <div class="event-card">
          <img
            src="https://images.unsplash.com/photo-1506157786151-b8491531f063"
          />
          <div class="event-info">
            <h3>Music Night</h3>
            <p>Cultural • 2026-05-05</p>
            <button onclick="openRegister('Music Night')">Register</button>
          </div>
        </div>
      </div>
    </section>

    <script>
      function openRegister(title) {
        window.location.href =
          "register.html?event=" + encodeURIComponent(title);
      }
    </script>
  </body>
</html>
